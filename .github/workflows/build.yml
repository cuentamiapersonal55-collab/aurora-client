name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Resolver versiones correctas de Fabric
        run: |
          MC=1.21.11
          YARN=$(curl -s "https://meta.fabricmc.net/v2/versions/yarn/$MC" | python3 -c "import sys,json;print(json.load(sys.stdin)[0]['version'])")
          LOADER=$(curl -s https://meta.fabricmc.net/v2/versions/loader | python3 -c "import sys,json;print([x for x in json.load(sys.stdin) if x['stable']][0]['version'])")
          API=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o "<version>[^<]*+$MC</version>" | tail -1 | sed 's/<[^>]*>//g')
          LOOM=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml | grep -o '<version>1\.14[^<]*' | sed 's/<version>//' | grep -v SNAPSHOT | tail -1)
          LOOM=${LOOM:-1.14-SNAPSHOT}
          echo "yarn=$YARN loader=$LOADER api=$API loom=$LOOM"
          sed -i "s|^yarn_mappings=.*|yarn_mappings=$YARN|" gradle.properties
          sed -i "s|^loader_version=.*|loader_version=$LOADER|" gradle.properties
          sed -i "s|^fabric_version=.*|fabric_version=$API|" gradle.properties
          sed -i "s|^loom_version=.*|loom_version=$LOOM|" gradle.properties
          cat gradle.properties

      - name: Compilar
        run: gradle build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-client-jar
          path: build/libs/aurora-client-1.0.0.jar
